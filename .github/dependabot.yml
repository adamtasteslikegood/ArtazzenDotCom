version: 2
updates:
  # Python dependencies
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    # pydantic hard-pins an exact pydantic-core; bumping them separately
    # produces an unresolvable requirements.txt.
    groups:
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic-core"

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "America/Los_Angeles"
    labels:
      - dependencies
    commit-message:
      prefix: "chore(actions)"
