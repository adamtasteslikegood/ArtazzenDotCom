name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: version
        run: |
          ver=$(cat VERSION | tr -d '[:space:]')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"

      - name: Check tag and release status
        id: check
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists on remote"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists — nothing to do"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        if: steps.check.outputs.release_exists == 'false'
        id: notes
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          notes=$(awk -v ver="$VER" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) found=1; next }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::No changelog content found for version $VER"
            exit 1
          fi
          echo "$notes" > /tmp/release-notes.md
          echo "Release notes:"
          cat /tmp/release-notes.md

      - name: Create tag if needed
        if: steps.check.outputs.tag_exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create release if needed
        if: steps.check.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VER: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            --title "$VER" \
            --notes-file /tmp/release-notes.md
