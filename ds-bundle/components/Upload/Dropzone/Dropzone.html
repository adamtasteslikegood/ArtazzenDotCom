<!-- @dsCard group="Upload" -->
<link rel="stylesheet" href="../../../styles.css">
<div style="display: flex; flex-direction: column; gap: 2rem;">
  <div>
    <p style="font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; opacity: 0.6; margin-bottom: 0.5rem;">Default state</p>
    <div class="dropzone">
      <p>Drop files here or click to browse</p>
      <p class="supported-formats">JPG, PNG, GIF, WEBP -- Max 50MB</p>
    </div>
  </div>
  <div>
    <p style="font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; opacity: 0.6; margin-bottom: 0.5rem;">Dragover state</p>
    <div class="dropzone is-dragover">
      <p>Drop files here or click to browse</p>
      <p class="supported-formats">JPG, PNG, GIF, WEBP -- Max 50MB</p>
    </div>
  </div>
</div>
